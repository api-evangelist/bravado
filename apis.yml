name: Bravado
description: Bravado is a community platform for sales professionals, best known as the War Room, which
  it describes as the world's largest online sales community with more than 400,000 members. Founded in
  2016 and headquartered in San Francisco, Bravado offers career networking, anonymous peer Q&A, a jobs
  and hiring marketplace that matches sales talent with companies, an AI recruiter called Hunter, and a
  virtual "commission points" rewards currency, delivered through the web and a mobile app. The company
  is backed by Redpoint Ventures. Bravado does not publish a public developer API; its product is built
  on an internal GraphQL backend. As of this profile's enrichment date the primary domain bravado.co
  resolves to a Gandi parking page ("this domain name is unavailable") and is not serving the live product.
